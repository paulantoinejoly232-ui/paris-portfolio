name: Visual QA — apartment browser
on:
  push:
    branches:
      - upgrade/architectural-fidelity-v4
    paths:
      - src/**
      - scripts/visual-qa.mjs
      - public/models/apartment.glb
      - public/assets/**
      - .github/workflows/visual-qa.yml
  workflow_dispatch:
concurrency:
  group: apartment-visual-qa-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start Vite and capture a real WebGL browser frame
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/visual-qa.mjs
      - name: Upload actual browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartment-browser-qa
          path: visual-qa/apartment-browser.png
          retention-days: 3
