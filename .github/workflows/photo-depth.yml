name: Reconstruct photograph depth (Depth Anything V2)
on:
  push:
    branches: [feature/depth-photo-walk]
    paths:
      - scripts/build-photo-depth.py
      - .github/workflows/photo-depth.yml
      - public/assets/photo-apartment-reference.jpg
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photo-depth-generation-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers==4.57.1' pillow numpy
      - name: Generate relative depth PNG
        run: python scripts/build-photo-depth.py
      - name: Commit depth PNG on preview branch
        run: |
          cp public/assets/photo-apartment-depth.png /tmp/photo-apartment-depth.png
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/photo-apartment-depth.png public/assets/photo-apartment-depth.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/photo-apartment-depth.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Apache-2.0 Depth Anything V2 scene depth"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: depth-photo-preview
          path: public/assets/photo-apartment-depth.png
          retention-days: 5
