name: Visual QA — photographic experience
on:
  push:
    branches:
      - feature/photo-real-apartment-tour
    paths:
      - src/**
      - scripts/photo-qa.mjs
      - .github/workflows/photo-qa.yml
  workflow_dispatch:
jobs:
  photo-qa:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
      - name: Test the photo and capture screenshots
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/photo-qa.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photographic-apartment-preview
          path: visual-qa/*.png
          retention-days: 5
