name: Export textured Paris apartment (Blender)
on:
  push:
    branches:
      - fix/apartment-realism-materials
      - rebuild/blender-r3f-apartment
    paths:
      - assets-src/blender/**
      - .github/workflows/bake-apartment.yml
  workflow_dispatch:
concurrency:
  group: apartment-furniture-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  blender-bake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CC0 furniture source metadata
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for slug in ['modern_arm_chair_01','dining_chair_02']:
              try:
                  request=urllib.request.Request('https://api.polyhaven.com/files/'+slug,headers={'User-Agent':'Portfolio-ArchViz/1.0'})
                  data=json.load(urllib.request.urlopen(request,timeout=20))
                  print('MODEL',slug,'CATEGORIES',list(data.keys()))
                  print('GLTF',json.dumps(data.get('gltf',{}))[:3500])
              except Exception as e:
                  print('MODEL API ERROR',slug,str(e))
          PY
      - name: Install Blender from Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
      - name: Generate physically based apartment
        run: blender -b -t 4 -P assets-src/blender/apartment.py
      - name: Upload Blender review screenshot
        uses: actions/upload-artifact@v4
        with:
          name: blender-apartment-qa
          path: public/models/apartment-review.jpg
          retention-days: 3
      - name: Commit corrected apartment assets without overwriting intervening work
        run: |
          mkdir -p /tmp/apartment-output
          cp public/models/apartment.glb public/models/texture-*.png public/models/apartment-review.jpg /tmp/apartment-output/
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p public/models
          cp /tmp/apartment-output/* public/models/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/apartment.glb public/models/texture-*.png public/models/apartment-review.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Export corrected photoreal apartment assets from Blender"
          git push
